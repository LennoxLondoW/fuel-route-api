<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuel Route Planner</title>
<link rel="preconnect" href="https://router.project-osrm.org">
<link rel="preconnect" href="https://tile.openstreetmap.org">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#fff; --fg:#1b1f24; --mut:#667; --card:#f4f6f8; --acc:#0b6bcb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171a; --fg:#e8eaed; --mut:#9aa; --card:#1f2428; --acc:#5aa9ff; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px system-ui,sans-serif; background:var(--bg); color:var(--fg); display:grid; grid-template-columns:380px 1fr; height:100vh; }
  aside { padding:16px; overflow:auto; border-right:1px solid #8884; }
  h1 { font-size:18px; margin:0 0 12px; }
  label { display:block; margin:8px 0 3px; color:var(--mut); font-size:12px; }
  input { width:100%; padding:8px; border:1px solid #8886; border-radius:6px; background:var(--bg); color:var(--fg); }
  button { margin-top:12px; width:100%; padding:10px; border:0; border-radius:6px; background:var(--acc); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; }
  #map { height:100%; }
  .card { background:var(--card); border-radius:8px; padding:10px 12px; margin-top:12px; }
  .big { font-size:24px; font-weight:700; }
  .row { display:flex; justify-content:space-between; gap:8px; padding:3px 0; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td, th { padding:4px 2px; text-align:left; border-bottom:1px solid #8883; }
  .err { color:#d33; }
  .note { color:var(--mut); font-size:11px; margin-top:10px; line-height:1.4; }
  .pin { background:var(--acc); color:#fff; border-radius:50%; width:24px; height:24px; text-align:center; line-height:24px; font-weight:700; border:2px solid #fff; }
  @media (max-width:760px) { body { grid-template-columns:1fr; grid-template-rows:auto 60vh; height:auto; } }
</style>
</head>
<body>
<aside>
  <h1>⛽ Fuel Route Planner</h1>
  <label>Start (USA)</label><input id="from" value="New York, NY">
  <label>Finish (USA)</label><input id="to" value="Los Angeles, CA">
  <button id="go">Plan route</button>
  <div id="out"></div>
  <div class="note">Assumes a 500 mi range, 10 MPG, and a full tank at departure. "City, ST" inputs resolve offline; other addresses fall back to Nominatim. Station positions are city-level (the price file has no coordinates), so stops within 10 mi of the route are considered.</div>
</aside>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="stations.js"></script>
<script src="cities.js"></script>
<script>
// ==== CORE (no DOM) ====
const RANGE = 500, MPG = 10, TOL = 10, MIN_SAVING = 0.03, MIN_HOP = 100;   // mi, mi/gal, corridor half-width (mi), $/gal gain to hop, min hop (mi)
const STEP = 1, CELL = 0.25, rad = Math.PI / 180;                          // route sampling (mi), station-grid cell (deg)
let calls = 0;

// 1) Offline geocoder: "City, ST", "City, State" and "lat,lon" resolve locally with zero network calls.
const norm = s => s.toLowerCase().replace(/\./g, '').replace(/[^a-z ]/g, ' ').replace(/\bsaint\b/g, 'st')
  .replace(/\bmount\b/g, 'mt').replace(/\bfort\b/g, 'ft').replace(/\s+/g, ' ').trim();
const CITY = new Map(), CODES = new Set(Object.values(STATES));
for (const row of CITIES.split('\n')) { const p = row.split('|'); CITY.set(p[0] + '|' + p[1], [+p[2], +p[3]]); }
function offline(q) {
  const m = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (m) return { lat: +m[1], lon: +m[2], name: q.trim() };
  const w = norm(q.replace(/,?\s*(usa|us|united states( of america)?)\s*$/i, '')).split(' ');
  for (const k of [2, 1]) {
    const st = w.slice(-k).join(' '), code = (k === 1 && CODES.has(st)) ? st : STATES[st];
    const hit = code && w.length > k && CITY.get(w.slice(0, -k).join(' ') + '|' + code);
    if (hit) return { lat: hit[0], lon: hit[1], name: q.trim() };
  }
  return null;
}

// 2) Google-polyline decoder (OSRM returns ~5x less data than GeoJSON) straight into typed arrays.
function decode(str) {
  const n = str.length, lat = new Float64Array(n >> 1), lon = new Float64Array(n >> 1);
  let i = 0, k = 0, a = 0, o = 0;
  while (i < n) {
    let b, s = 0, r = 0;
    do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << s; s += 5; } while (b >= 32);
    a += (r & 1) ? ~(r >> 1) : r >> 1;
    s = 0; r = 0;
    do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << s; s += 5; } while (b >= 32);
    o += (r & 1) ? ~(r >> 1) : r >> 1;
    lat[k] = a / 1e5; lon[k++] = o / 1e5;
  }
  return { lat: lat.subarray(0, k), lon: lon.subarray(0, k) };
}

// 3) Station spatial index, built once: typed arrays + a CSR grid (cell -> station ids).
const N = STATIONS.length, sLa = new Float64Array(N), sLo = new Float64Array(N), sP = new Float64Array(N);
// Some city names in the price file are padded out with trailing spaces ("Lampasas      ").
STATIONS.forEach((s, i) => { s[0] = s[0].trim(); s[1] = s[1].trim(); sLa[i] = s[3]; sLo[i] = s[4]; sP[i] = s[5]; });
const AVG_PRICE = sP.reduce((t, p) => t + p, 0) / (N || 1);   // fallback when no station is near the route
const LA0 = Math.floor(Math.min(...sLa)), LO0 = Math.floor(Math.min(...sLo));
const NY = Math.floor((Math.max(...sLa) - LA0) / CELL) + 1, NX = Math.floor((Math.max(...sLo) - LO0) / CELL) + 1;
const cellStart = new Int32Array(NX * NY + 1), cellIds = new Int32Array(N), cellOf = new Int32Array(N);
for (let i = 0; i < N; i++) { cellOf[i] = Math.floor((sLa[i] - LA0) / CELL) * NX + Math.floor((sLo[i] - LO0) / CELL); cellStart[cellOf[i] + 1]++; }
for (let c = 0; c < NX * NY; c++) cellStart[c + 1] += cellStart[c];
const fillPos = cellStart.slice(0, NX * NY);
for (let i = 0; i < N; i++) cellIds[fillPos[cellOf[i]]++] = i;

// 4) Corridor: O(route + nearby stations) instead of O(stations x route vertices).
function corridor(lat, lon, D) {
  const n = lat.length, la = new Float64Array(n), lo = new Float64Array(n), cum = new Float64Array(n);
  let m = 1, cl = Math.cos(lat[0] * rad); la[0] = lat[0]; lo[0] = lon[0];
  for (let i = 1; i < n; i++) {                        // keep ~1 vertex per mile; cum = miles along route
    const dy = (lat[i] - la[m - 1]) * 69.09, dx = (lon[i] - lo[m - 1]) * 69.17 * cl, d2 = dx * dx + dy * dy;
    if (d2 >= STEP * STEP || i === n - 1) { la[m] = lat[i]; lo[m] = lon[i]; cum[m] = cum[m - 1] + Math.sqrt(d2); cl = Math.cos(lat[i] * rad); m++; }
  }
  const k = cum[m - 1] ? D / cum[m - 1] : 1;            // rescale to OSRM's own distance
  let maxLat = 0; for (let v = 0; v < m; v++) maxLat = Math.max(maxLat, Math.abs(la[v]));
  const rLa = Math.ceil(TOL / (69.09 * CELL)), rLo = Math.ceil(TOL / (69.17 * Math.cos(maxLat * rad) * CELL));
  const bd = new Float64Array(N).fill(Infinity), bv = new Int32Array(N), seen = [];
  for (let v = 0; v < m; v++) {                         // each vertex scans only the grid cells around it
    const cy = Math.floor((la[v] - LA0) / CELL), cx = Math.floor((lo[v] - LO0) / CELL), cv = Math.cos(la[v] * rad);
    for (let y = Math.max(cy - rLa, 0); y <= Math.min(cy + rLa, NY - 1); y++)
      for (let x = Math.max(cx - rLo, 0); x <= Math.min(cx + rLo, NX - 1); x++) {
        const c = y * NX + x;
        for (let j = cellStart[c]; j < cellStart[c + 1]; j++) {
          const id = cellIds[j], dy = sLa[id] - la[v], dx = (sLo[id] - lo[v]) * cv, d2 = dx * dx + dy * dy;
          if (d2 < bd[id]) { if (bd[id] === Infinity) seen.push(id); bd[id] = d2; bv[id] = v; }
        }
      }
  }
  const out = [];
  for (const id of seen) {
    const off = Math.sqrt(bd[id]) * 69.1;
    if (off <= TOL) { const s = STATIONS[id]; out.push({ name: s[0], city: s[1], st: s[2], la: sLa[id], lo: sLo[id], p: sP[id], d: cum[bv[id]] * k, off }); }
  }
  return out.sort((x, y) => x.d - y.d);
}

// --- Cost-minimising fuel plan (greedy "next cheaper station" strategy) ---
function plan(c, D) {
  const cheapest = w => w.reduce((m, s) => (s.p < m.p || (s.p === m.p && s.d > m.d)) ? s : m);
  const stops = []; let f = RANGE, cur = null, rec = null, leftover = 0;
  for (;;) {
    if (cur === null) {
      if (D <= f) break;
      const w0 = c.filter(s => s.d <= RANGE), w = w0.filter(s => s.d >= MIN_HOP);
      if (!w0.length) throw new Error('No fuel station within range of the start.');
      cur = cheapest(w.length ? w : w0); f = RANGE - cur.d;
      rec = { s: cur, arrive: f, buy: 0 }; stops.push(rec); continue;
    }
    const win = c.filter(s => s.d > cur.d && s.d <= cur.d + RANGE);
    const cheaper = win.find(s => s.p < cur.p - MIN_SAVING);
    let next;
    if (D - cur.d <= RANGE && (!cheaper || D <= cheaper.d)) { rec.buy = Math.max(0, D - cur.d - f); leftover = (f + rec.buy - (D - cur.d)) / MPG * cur.p; break; }
    if (cheaper) { next = cheaper; rec.buy = Math.max(0, next.d - cur.d - f); }
    else {
      if (!win.length) throw new Error(`No station within ${RANGE} mi after mile ${Math.round(cur.d)}.`);
      const far = win.filter(s => s.d - cur.d >= MIN_HOP);
      next = cheapest(far.length ? far : win); rec.buy = RANGE - f;
    }
    f += rec.buy - (next.d - cur.d);
    cur = next; rec = { s: cur, arrive: f, buy: 0 }; stops.push(rec);
  }
  // The full starting tank is billed at the first stop's price (cheapest on-route price if no stop is needed);
  // any fuel still in the tank at the destination is credited back.
  const initGal = stops.length ? RANGE / MPG : D / MPG;
  // No station anywhere near a short route: bill the starting tank at the national average
  // rather than NaN, which used to render the whole summary as "$NaN".
  const initP = stops.length ? stops[0].s.p : (c.length ? Math.min(...c.map(s => s.p)) : AVG_PRICE);
  stops.forEach(r => { r.gal = r.buy / MPG; r.cost = r.gal * r.s.p; });
  const startCost = initGal * initP;
  return { stops: stops.filter(r => r.buy > 0.01), startCost, initGal, initP,
           total: startCost - leftover + stops.reduce((t, r) => t + r.cost, 0) };
}


// ==== UI ====
const $ = id => document.getElementById(id);
const map = L.map('map', { preferCanvas: true }).setView([39.5, -98.35], 4);   // canvas renderer: fast for 30k-point lines
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
const layer = L.layerGroup().addTo(map);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const usd = n => '$' + n.toFixed(2);

async function nominatim(q) {                           // fallback only: street addresses, ZIPs, unknown towns
  calls++;
  const j = await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=' + encodeURIComponent(q))).json();
  if (!j.length) throw new Error('Could not find a US location for "' + q + '"');
  return { lat: +j[0].lat, lon: +j[0].lon, name: j[0].display_name };
}
const geocode = async q => offline(q) || nominatim(q);

async function route(a, b) {                            // the one routing call
  calls++;
  const u = `https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=polyline`;
  const j = await (await fetch(u)).json();
  if (j.code !== 'Ok') throw new Error('Routing failed: ' + (j.message || j.code));
  return { D: j.routes[0].distance / 1609.344, ...decode(j.routes[0].geometry) };
}
const cache = new Map();                                // repeat trips need zero network calls

$('go').onclick = async () => {
  const btn = $('go'), out = $('out'); btn.disabled = true; out.innerHTML = '<div class="card">Planning…</div>';
  try {
    calls = 0; const t = [performance.now()];
    const [a, b] = await Promise.all([geocode($('from').value), geocode($('to').value)]); t.push(performance.now());
    const key = [a.lat, a.lon, b.lat, b.lon].map(v => v.toFixed(3)).join();
    let rt = cache.get(key);
    if (!rt) { rt = await route(a, b); cache.set(key, rt); if (cache.size > 20) cache.delete(cache.keys().next().value); }
    t.push(performance.now());
    const D = rt.D, res = plan(corridor(rt.lat, rt.lon, D), D); t.push(performance.now());

    layer.clearLayers();
    if (!rt.pts) { rt.pts = new Array(rt.lat.length); for (let i = 0; i < rt.pts.length; i++) rt.pts[i] = [rt.lat[i], rt.lon[i]]; }
    const line = L.polyline(rt.pts, { color: '#0b6bcb', weight: 5, smoothFactor: 2 }).addTo(layer);
    L.marker([a.lat, a.lon]).addTo(layer).bindPopup('Start: ' + esc(a.name));
    L.marker([b.lat, b.lon]).addTo(layer).bindPopup('Finish: ' + esc(b.name));
    res.stops.forEach((r, i) => L.marker([r.s.la, r.s.lo], { icon: L.divIcon({ className: '', html: `<div class="pin">${i + 1}</div>`, iconSize: [24, 24] }) })
      .addTo(layer).bindPopup(`<b>${esc(r.s.name)}</b><br>${esc(r.s.city)}, ${r.s.st}<br>$${r.s.p.toFixed(3)}/gal · buy ${r.gal.toFixed(1)} gal = ${usd(r.cost)}<br>Mile ${Math.round(r.s.d)}`));
    map.fitBounds(line.getBounds(), { padding: [30, 30], animate: false }); t.push(performance.now());
    const ph = t.slice(1).map((v, i) => (v - t[i]).toFixed(i === 1 || i === 2 ? 1 : 0)).join(' / ');

    out.innerHTML = `
      <div class="card"><div class="big">${usd(res.total)}</div>total fuel cost
        <div class="row"><span>Distance</span><b>${D.toFixed(0)} mi</b></div>
        <div class="row"><span>Fuel used</span><b>${(D / MPG).toFixed(1)} gal</b></div>
        <div class="row"><span>Fuel-ups</span><b>${res.stops.length}</b></div>
        <div class="row"><span>Starting tank (${res.initGal.toFixed(1)} gal @ $${res.initP.toFixed(3)})</span><b>${usd(res.startCost)}</b></div>
        <div class="row"><span>Total time</span><b>${Math.round(t[4] - t[0])} ms · ${calls} API call${calls === 1 ? '' : 's'}</b></div>
        <div class="row"><span>geocode / route / plan / draw</span><b>${ph} ms</b></div></div>
      ${res.stops.length ? `<div class="card"><table><tr><th>#</th><th>Station</th><th>Mile</th><th>$/gal</th><th>Gal</th><th>Cost</th></tr>` +
        res.stops.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.s.name)}<br><small>${esc(r.s.city)}, ${r.s.st}</small></td><td>${Math.round(r.s.d)}</td><td>${r.s.p.toFixed(3)}</td><td>${r.gal.toFixed(1)}</td><td>${usd(r.cost)}</td></tr>`).join('') + '</table></div>'
        : '<div class="card">No fuel stop needed — the trip fits in one tank.</div>'}`;
  } catch (e) { out.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
  btn.disabled = false;
};
</script>
</body>
</html>
